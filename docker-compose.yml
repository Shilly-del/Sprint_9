version: '3.8'

services:
  selenoid:
    image: "aerokube/selenoid"
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - "./config.json:/etc/selenoid/config.json"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./video:/opt/selenoid/video"
      - "./logs:/opt/selenoid/logs"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
    command: [ "-conf", "/etc/selenoid/config.json", "-container-network", "selenoid" ]

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    networks:
      - selenoid
    depends_on:
      - selenoid
    command: [ "--selenoid-uri", "http://selenoid:4444" ]

  selenium-tests:
    build: .
    container_name: test
    volumes:
      - "./allure-results:/app/allure-results"
      - "./video:/opt/selenoid/video"
    depends_on:
      - selenoid
    networks:
      - selenoid
    environment:
      - PYTHONUNBUFFERED=1
      - SELENOID_URI=http://selenoid:4444
    command: pytest --alluredir=allure-results -v
    mem_limit: 2g
    cpus: '1.0'

networks:
  selenoid:
    name: selenoid
    driver: bridge
