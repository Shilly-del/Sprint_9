[project]
name = "sprint-9"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.15.7",
    "pytest>=8.0.0",
    "allure-pytest>=2.13.0",
    "selenium>=4.0.0"
]

[tool.pytest.ini_options]
addopts = [
    "-v",
    "-s",
    "--alluredir=allure-results",
    "--clean-alluredir"
]
[tool.setuptools.packages.find]
where = ["."]
include = ["pages*", "tests*"]  # укажите ваши основные пакеты
exclude = ["assets*", "allure-results*", "venv*", ".venv*", "__pycache__*"]